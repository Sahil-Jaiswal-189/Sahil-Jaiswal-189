name: Update Pune dashboard
on:
  workflow_dispatch:
  schedule:
    # Re-register the hourly trigger. :30 UTC is :00 in Pune (IST).
    - cron: '30 0-23 * * *'
  push:
    paths:
      - scripts/update_dashboard.py
      - .github/workflows/pune-dashboard.yml
permissions:
  contents: write
concurrency:
  group: pune-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check weather failure handling
        run: python -m unittest discover -s tests
      - run: python scripts/update_dashboard.py
      - name: Save dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pune-dashboard.svg assets/pune-weather.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Pune dashboard"
            git push
          fi
