name: Update contribution streak
on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. :30 UTC is :00 in Pune (IST).
    - cron: '30 0-23 * * *'
  push:
    paths:
      - scripts/update_streak.py
      - .github/workflows/pune-dashboard.yml
permissions:
  contents: write
concurrency:
  group: contribution-streak
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh contribution streak
        continue-on-error: true
        run: python scripts/update_streak.py
      - name: Save contribution streak
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-streak.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution streak"
            git push
          fi
